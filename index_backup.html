
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eef4ec">
<title>SANAPUZESHA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --green:#5b3a50;
  --dark-green: #47293d;
  --olive: #7d5a6e;
  --cream: #eef4ec;
  --gold: #a8c4a0;
  --text: #5b3a50;
  --muted: #9a8296;
  --card: #ffffff;
  --stroke: #d5e3d1;
  --soft: #e3efe0;
  --plum-soft: #efe6ec;
}

body {
  background:
    radial-gradient(1200px 500px at 50% -10%, #e6efe2 0%, transparent 60%),
    radial-gradient(900px 400px at 110% 110%, #e9e0e6 0%, transparent 55%),
    #d8e5d4;
  color: var(--text);
  font-family: "Plus Jakarta Sans", "Segoe UI", Arial, sans-serif;
  min-height: 100vh;
}

.font-serif {
  font-family: "Cormorant Garamond", Georgia, serif;
}

.arabic, [lang="ar"] {
  font-family: "Amiri", "Traditional Arabic", Georgia, serif;
}

button {
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.app {
  width: 100%;
  max-width: 440px;
  height: 100dvh;
  margin: 0 auto;
  background:
    radial-gradient(600px 260px at 100% 0%, #e9e0e655 0%, transparent 70%),
    radial-gradient(500px 240px at 0% 18%, #dfeadcaa 0%, transparent 70%),
    var(--cream);
  position: relative;
  padding-bottom: 95px;
  overflow: hidden;
  box-shadow: 0 0 40px #5b3a500c;
}

.topbar {
  padding: 28px 24px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 40px;
  height: 40px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #5b3a50, #7d5a6e);
  color: #f3eaf0;
  font-size: 22px;
  box-shadow: 0 6px 18px #5b3a5033, inset 0 1px 0 #ffffff30;
}

.brand-name {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: .5px;
  color: #5b3a50;
}

.brand-subtitle {
  color: var(--muted);
  font-size: 8.5px;
  margin-top: 2px;
  letter-spacing: 2.4px;
  font-weight: 500;
}

.profile {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #fff;
  border: 1px solid var(--stroke);
  color: var(--green);
  font-size: 18px;
  box-shadow: 0 3px 12px #5b3a500a;
  transition: .2s;
}

.profile:active {
  transform: scale(.93);
}

.greeting {
  padding: 16px 24px 20px;
  position: relative;
}

.date {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 9.5px;
  letter-spacing: 2.4px;
  color: var(--olive);
  text-transform: uppercase;
  margin-bottom: 12px;
  font-weight: 600;
}

.date::before {
  content: "";
  width: 18px;
  height: 1px;
  background: var(--gold);
}

.greeting h1 {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 30px;
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: -.5px;
  color: #5b3a50;
}

.greeting h1 span {
  color: var(--olive);
  font-style: italic;
}

.greeting p {
  margin-top: 9px;
  color: #9a8296;
  font-size: 12px;
  line-height: 1.7;
  font-weight: 300;
}

.doa-count {
  margin-top: 14px;
  padding: 11px 14px;
  background: linear-gradient(135deg, #f8f3ff, #f1e8ff);
  color: #7652a8;
  border: 1px solid #e8dcf8;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.4px;
  text-align: center;
}

.count-icon {
  color: #9b76cf;
  margin-right: 5px;
  font-size: 14px;
}

.back-button {
  width: 42px;
  height: 42px;
  border: 1px solid #e3efe0;
  border-radius: 15px;
  background: #ffffff;
  color: #5b3a50;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: .2s;
}

.back-button svg {
  width: 21px;
  height: 21px;
}

.back-button:active {
  transform: scale(.94);
  background: #f1e8f4;
}


/* PILIHAN ZIKIR PREMIUM */
.zikir-options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 22px;
}

.zikir-choice {
  width: 100%;
  text-align: left;
  padding: 17px;
  border: 1px solid #d5e3d1;
  border-radius: 20px;
  background: linear-gradient(145deg, #ffffff, #f8fbf7);
  box-shadow: 0 4px 16px #5b3a5008;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: .2s;
}

.zikir-choice.active {
  border: 1px solid #7d5a6e;
  background: linear-gradient(145deg, #efe6ec, #f8fbf7);
  box-shadow: 0 5px 18px #5b3a5012;
}

.zikir-choice:active {
  transform: scale(.97);
}

.zikir-choice-name {
  color: #5b3a50;
  font-weight: 600;
  font-size: 14px;
}

.zikir-choice-arab {
  color: #47293d;
  font-family: "Amiri", serif;
  font-size: 25px;
  text-align: right;
  line-height: 1.9;
}

.zikir-choice-meaning {
  color: #9a8296;
  font-size: 11px;
  line-height: 1.7;
}

.zikir-main-arab {
  font-family: "Amiri", serif;
  font-size: 34px;
  line-height: 2;
  color: #47293d;
  margin: 18px 0 10px;
}

.back-button {
  width: 42px;
  height: 42px;
  border: 1px solid #e3efe0;
  border-radius: 15px;
  background: #ffffff;
  color: #5b3a50;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: .2s;
}

.back-button svg {
  width: 21px;
  height: 21px;
}

.back-button:active {
  transform: scale(.94);
  background: #f1e8f4;
}

/* HEADER SANAPUZESHA */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 50px;
  height: 50px;
  border-radius: 17px;
  background: #6f4965;
  color: #f8f3fa;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 5px 14px rgba(80, 45, 75, 0.12);
  flex-shrink: 0;
}

.logo svg {
  width: 23px;
  height: 23px;
}

.brand-text {
  display: flex;
  flex-direction: column;
}

.brand-name {
  font-size: 20px;
  letter-spacing: 0.5px;
  font-family: Georgia, serif;
  color: #5b3a50;
}

.brand-subtitle {
  font-size: 9px;
  letter-spacing: 2.3px;
  color: #8c7185;
  margin-top: 3px;
}

.profile-button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid #dce8d7;
  background: #ffffff;
  color: #6f4965;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}

.profile-button svg {
  width: 18px;
  height: 18px;
}

.profile-button:active {
  transform: scale(.94);
}

/* PROFIL SANAPUZESHA PREMIUM */

.profile-page {
  padding-bottom: 20px;
}

.profile-hero {
  text-align: center;
  padding: 28px 20px;
  margin-bottom: 26px;
  border-radius: 28px;
  background: linear-gradient(145deg, #fdfcff, #f0e8f3);
  border: 1px solid #e8dce9;
  box-shadow: 0 8px 25px #5b3a5008;
}

.profile-logo {
  width: 88px;
  height: 88px;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 26px;
  background: linear-gradient(145deg, #5b3a50, #896b82);
  color: #ffffff;
  font-size: 46px;
  box-shadow: 0 10px 25px #5b3a5025;
}

.profile-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 27px;
  font-weight: 700;
  color: #5b3a50;
  letter-spacing: 1px;
}

.profile-tagline {
  margin-top: 5px;
  color: #987b91;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.profile-description {
  color: #8e7889;
  font-size: 13px;
  line-height: 1.8;
  margin-top: 18px;
}

.profile-section-title {
  color: #5b3a50;
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 600;
  margin: 0 0 14px 4px;
}

.profile-menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.profile-menu-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 18px 16px;
  border-radius: 22px;
  background: #ffffff;
  border: 1px solid #e4eadd;
  box-shadow: 0 5px 18px #5b3a5008;
}

.profile-menu-icon {
  min-width: 43px;
  height: 43px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 15px;
  background: #f1e8f4;
  color: #7d5a6e;
  font-size: 20px;
}

.profile-menu-content h3 {
  font-size: 14px;
  font-weight: 600;
  color: #5b3a50;
  margin: 2px 0 7px;
}

.profile-menu-content p {
  color: #998798;
  font-size: 12px;
  line-height: 1.8;
  margin: 0;
}

.profile-footer {
  text-align: center;
  padding: 28px 10px 12px;
}

.profile-footer-name {
  color: #7d5a6e;
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  letter-spacing: 2px;
}

.profile-footer p {
  color: #9a8296;
  font-size: 12px;
  margin: 8px 0;
}

.profile-footer span {
  color: #b4a2b3;
  font-size: 10px;
  letter-spacing: 1px;
}

/* BANNER MASJID */
.mosque-banner {
  margin: 0 20px 24px;
  padding: 14px 16px 6px;
  background:
    radial-gradient(240px 90px at 80% 0%, #efe6ec88 0%, transparent 70%),
    linear-gradient(165deg, #f7fbf6 0%, #eef4ec 100%);
  border: 1px solid #d5e3d1;
  border-radius: 26px;
  box-shadow: 0 8px 26px #5b3a500e;
  overflow: hidden;
  position: relative;
}

.mosque-banner::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, #7d5a6e, #a8c4a0, #7d5a6e);
  opacity: .7;
}

.mosque-banner svg {
  display: block;
  width: 100%;
  height: auto;
  animation: floaty 5s ease-in-out infinite;
}

@keyframes floaty {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* KARTU DOA HARIAN */
.daily-card {
  position: relative;
  margin: 2px 20px 30px;
  border-radius: 26px;
  padding: 26px 22px 20px;
  color: var(--text);
  background:
    radial-gradient(220px 140px at 110% -10%, #5b3a5014 0%, transparent 70%),
    radial-gradient(200px 140px at -10% 110%, #a8c4a030 0%, transparent 70%),
    linear-gradient(165deg, #ffffff 0%, #f6faf4 100%);
  border: 1px solid #d5e3d1;
  box-shadow: 0 10px 32px #5b3a5012, 0 1px 0 #ffffffaa inset;
  overflow: hidden;
}

.daily-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, #7d5a6e, #a8c4a0, #7d5a6e);
  opacity: .7;
}

.daily-card::after {
  content: "﷽";
  position: absolute;
  right: -12px;
  bottom: -18px;
  font-size: 90px;
  font-family: "Amiri", serif;
  color: #5b3a500a;
  pointer-events: none;
  line-height: 1;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  z-index: 1;
}

.card-label {
  font-size: 8.5px;
  letter-spacing: 2.2px;
  color: #7d5a6e;
  text-transform: uppercase;
  font-weight: 600;
}

.card-date {
  font-size: 9px;
  letter-spacing: .5px;
  color: #7d5a6e;
  background: #e3efe0;
  padding: 6px 12px;
  border-radius: 20px;
  font-weight: 500;
}

.card-heading {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 25px;
  font-weight: 600;
  margin-top: 18px;
  position: relative;
  z-index: 1;
  line-height: 1.3;
  color: #5b3a50;
}

.daily-card .arabic {
  font-family: "Amiri", serif;
  font-size: 32px;
  text-align: center;
  line-height: 2.2;
  margin: 20px 0 14px;
  position: relative;
  z-index: 1;
  color: #47293d;
}

.translation {
  text-align: center;
  color: #8a7290;
  font-size: 12px;
  line-height: 1.85;
  position: relative;
  z-index: 1;
  padding: 0 4px;
  font-weight: 300;
}

.card-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, #d5e3d1, transparent);
  margin: 22px 0 14px;
  position: relative;
  z-index: 1;
}

.card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 1;
}

.source {
  font-size: 10px;
  letter-spacing: 1px;
  color: #9a8296;
}

.card-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.action {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid #d5e3d1;
  background: #fff;
  color: var(--green);
  display: grid;
  place-items: center;
  font-size: 15px;
  transition: .18s;
  box-shadow: 0 2px 8px #5b3a500a;
}

.action:active {
  transform: scale(.88);
}

.action.favorite.active {
  background: linear-gradient(145deg, #5b3a50, #7d5a6e);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 14px #5b3a5040;
}

.section {
  padding: 0 22px;
  margin-bottom: 28px;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.section-heading h2 {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 22px;
  font-weight: 600;
  color: #5b3a50;
}

.see-all {
  border: 0;
  background: transparent;
  color: #7d5a6e;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .3px;
  padding: 6px 2px;
}

.see-all:active {
  opacity: .6;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px;
}

.category-card {
  border: 1px solid #d5e3d1;
  background: linear-gradient(160deg, #ffffff 0%, #f7fbf6 100%);
  border-radius: 20px;
  padding: 16px 13px;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  min-height: 80px;
  transition: .2s;
  box-shadow: 0 4px 16px #5b3a5008;
  position: relative;
  overflow: hidden;
}

.category-card::after {
  content: "";
  position: absolute;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: #a8c4a022;
  top: -28px;
  right: -22px;
  pointer-events: none;
}

.category-card:active {
  transform: scale(.96);
  box-shadow: 0 2px 8px #5b3a500a;
}

.category-icon {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border-radius: 16px;
  background: linear-gradient(145deg, #e3efe0, #d9e8d5);
  display: grid;
  place-items: center;
  font-size: 19px;
  color: #5b3a50;
  box-shadow: inset 0 1px 0 #ffffff80;
}

.category-card:nth-child(2) .category-icon {
  background: linear-gradient(145deg, #efe6ec, #e5d9e1);
}

.category-card:nth-child(3) .category-icon {
  background: linear-gradient(145deg, #e9f0e4, #dcead6);
}

.category-card:nth-child(4) .category-icon {
  background: linear-gradient(145deg, #f0ebe4, #e8dfd5);
}

.category-name {
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.5;
  color: #5b3a50;
}

.category-count {
  font-size: 10px;
  color: #9a8296;
  margin-top: 3px;
  font-weight: 300;
}

/* NAVIGASI BAWAH */
.bottom-nav {
  position: absolute;
  z-index: 10;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 408px;
  height: 64px;
  padding: 6px;
  background: #ffffffee;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid #d5e3d1;
  border-radius: 24px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  box-shadow: 0 10px 30px #5b3a501a, 0 1px 0 #ffffffcc inset;
}

.nav-item {
  border: 0;
  background: transparent;
  color: #b3a3ba;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 9.5px;
  font-weight: 500;
  border-radius: 18px;
  transition: .18s;
}

.nav-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  margin: 0 auto 5px;
  transition: all .25s ease;
}

.nav-icon svg {
  width: 23px;
  height: 23px;
  display: block;
}

.nav-item.active .nav-icon {
  transform: translateY(-1px);
}

.nav-item.active {
  color: #5b3a50;
  font-weight: 600;
  background: linear-gradient(145deg, #e3efe0, #efe6ec);
}

.nav-item.active .nav-icon {
  transform: translateY(-1px);
}

.notice {
  position: fixed;
  left: 50%;
  bottom: 90px;
  transform: translate(-50%, 10px);
  background: #5b3a50;
  color: white;
  padding: 12px 18px;
  border-radius: 12px;
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transition: .2s;
  z-index: 20;
  width: max-content;
  max-width: 90%;
}

.notice.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* Animasi */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

.topbar,
.greeting,
.mosque-banner,
.daily-card,
.section,
.prayer,
.tasbih-card {
  animation: fadeUp .55s cubic-bezier(.22, 1, .36, 1) both;
}

.greeting { animation-delay: .05s; }
.mosque-banner { animation-delay: .1s; }
.daily-card { animation-delay: .17s; }
.section { animation-delay: .24s; }

@media (min-width: 600px) {
  body {
    min-height: 100vh;
    padding: 16px 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .app {
    width: 420px;
    max-width: calc(100vw - 40px);
    height: calc(100vh - 32px);
    min-height: 0;
    margin: 0 auto;
    border: 8px solid #252823;
    border-radius: 42px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }

  .bottom-nav {
    position: sticky;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    margin: 0 auto;
  }
}

/* KARTU DOA */
.arabic {
  font-size: 29px;
  text-align: center;
  line-height: 2;
  margin: 15px 0 10px;
}

.prayer {
  background: linear-gradient(165deg, #ffffff 0%, #f8fbf7 100%);
  border: 1px solid #d5e3d1;
  border-radius: 22px;
  padding: 22px 18px 18px;
  margin-bottom: 14px;
  box-shadow: 0 4px 18px #5b3a5008;
  transition: .2s;
  position: relative;
  overflow: hidden;
}

.prayer::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, #a8c4a0, #7d5a6e);
  opacity: .55;
}

.prayer:active {
  transform: scale(.985);
  box-shadow: 0 2px 10px #5b3a500a;
}

.prayer-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.number {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: linear-gradient(145deg, #e3efe0, #efe6ec);
  color: #5b3a50;
  font-weight: 600;
  font-size: 14px;
  font-family: "Cormorant Garamond", Georgia, serif;
}

.prayer h3 {
  color: #5b3a50;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 5px;
}

.tag {
  display: inline-block;
  background: #e3efe0;
  color: #7d5a6e;
  padding: 5px 11px;
  border-radius: 20px;
  font-size: 9.5px;
  letter-spacing: .4px;
  font-weight: 500;
}

.prayer .arabic {
  font-family: "Amiri", serif;
  color: #47293d;
  font-size: 30px;
  line-height: 2.2;
  margin: 18px 0 10px;
  text-align: center;
}

.latin {
  color: #8a7290;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 15px;
  font-style: italic;
  line-height: 1.7;
  margin-bottom: 14px;
}

.meaning {
  background: linear-gradient(145deg, #f3f8f2, #efe6ec66);
  border-radius: 16px;
  padding: 14px;
  color: #7d5a6e;
  font-size: 12px;
  line-height: 1.75;
  border: 1px solid #d5e3d180;
}

.meaning strong {
  display: block;
  color: #5b3a50;
  font-size: 9px;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.speak-btn {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid #d5e3d1;
  background: #fff;
  color: #7d5a6e;
  font-size: 15px;
  display: grid;
  place-items: center;
  transition: .18s;
  box-shadow: 0 2px 8px #5b3a500a;
}

.speak-btn:active {
  transform: scale(.88);
}

.speak-btn.speaking {
  background: linear-gradient(145deg, #5b3a50, #7d5a6e);
  border-color: transparent;
  color: #fff;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 #5b3a5044; }
  50% { box-shadow: 0 0 0 7px #5b3a5000; }
}

<script>
const notice = document.getElementById("notice");
let noticeTimeout;

function showNotice(message) {
  notice.textContent = message;
  notice.classList.add("show");
  clearTimeout(noticeTimeout);
  noticeTimeout = setTimeout(() => {
    notice.classList.remove("show");
  }, 2200);
}

// Sapaan
document.getElementById("today").textContent = "ASSALAMUALAIKUM";

// Fitur suara
function speakText(text, button) {
  if (!("speechSynthesis" in window)) {
    showNotice("Browser tidak mendukung fitur suara");
    return;
  }

  if (speechSynthesis.speaking) {
    speechSynthesis.cancel();
    document.querySelectorAll(".speak-btn").forEach(btn => {
      btn.classList.remove("speaking");
    });
  }

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "id-ID";
  utterance.rate = 0.85;

  if (button) {
    button.classList.add("speaking");
    utterance.onend = () => button.classList.remove("speaking");
    utterance.onerror = () => button.classList.remove("speaking");
  }

  speechSynthesis.speak(utterance);
}

// Render daftar doa
function renderPrayerList(list, container) {
  if (!container) return;

  container.innerHTML = "";

  if (list.length === 0) {
    container.innerHTML = `
      <div class="prayer">
        <p style="text-align:center;color:#9a8296">
          Doa tidak ditemukan.
        </p>
      </div>`;
    return;
  }

  list.forEach((prayer, index) => {
    const card = document.createElement("article");
    card.className = "prayer";

    card.innerHTML = `
      <div class="prayer-top">
        <div class="number">${index + 1}</div>
        <div>
          <h3>${prayer.title}</h3>
          <span class="tag">${prayer.category}</span>
        </div>
      </div>

      <button class="speak-btn" aria-label="Bacakan doa">♫</button>

      <div class="arabic" lang="ar" dir="rtl">${prayer.arabic}</div>

      <p class="latin">${prayer.latin}</p>

      <div class="meaning">
        <strong>Artinya</strong>
        ${prayer.meaning}
      </div>

      <div class="doa-count">
        <span class="count-icon">✦</span>
        dibaca ${prayer.count || "1 kali"}
      </div>
    `;

    card.querySelector(".speak-btn").addEventListener("click", event => {
      speakText(prayer.latin + ". Artinya: " + prayer.meaning, event.currentTarget);
    });

    container.appendChild(card);
  });
}

function setupNavigation(activePage = "Home") {
  const navItems = document.querySelectorAll(".nav-item");

  navItems.forEach(button => {
    button.classList.remove("active");
      button.classList.toggle(
        "active",
        button.dataset.page === activePage
      );
        button.onclick = () => {
      const page = button.dataset.page;

      if (page === "Home") openHome();
      if (page === "Explore") openExplore();
      if (page === "Zikir") openZikir();
      if (page === "Profil") openProfil();
    };
  });
}

function openHome() {
  pageContent.innerHTML = homeMarkup;
  setupHomeButtons();
  setupNavigation("Home");
}

function setupHomeButtons() {
  const profile = document.getElementById("profileButton");
  if (profile) profile.addEventListener("click", openProfil);

  const explore = document.getElementById("exploreButton");
  if (explore) explore.addEventListener("click", openExplore);

  document.querySelectorAll(".category-card").forEach(button => {
    button.addEventListener("click", () => {
      openExplore(button.dataset.filter);

  });

function renderExplore() {
  const search = document.getElementById("exploreSearch");
  const query = search.value.toLowerCase();

  const filtered = prayers.filter(prayer =>
    prayer.title.toLowerCase().includes(query) ||
    prayer.category.toLowerCase().includes(query) ||
    prayer.meaning.toLowerCase().includes(query)
  );

  renderPrayerList(filtered, document.getElementById("exploreList"));
}

      id: "tahmid",
      nama: "Tahmid",
      arab: "الْحَمْدُ لِلَّهِ",
      arti: "Segala puji bagi Allah."
    },
    {
      id: "takbir",
      nama: "Takbir",
      arab: "اللَّهُ أَكْبَرُ",
      arti: "Allah Maha Besar."
    },
    {
      id: "tahlil",
      nama: "Tahlil",
      arab: "لَا إِلَٰهَ إِلَّا اللَّهُ",
      arti: "Tiada Tuhan selain Allah."
    }
  ];

  let selected = daftarZikir[0];

  pageContent.innerHTML = `
    <header class="topbar">
      <div class="brand">
        <button class="back-button" onclick="openHome()" aria-label="Kembali ke Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/>
            <path d="m12 19-7-7 7-7"/>
          </svg>
        </button>
        <div>
          <div class="brand-name">Zikir</div>
          <div class="brand-subtitle">HITUNGAN ZIKIR HARIAN</div>
      </div>
    </div>
  </header>

    <section class="section">

      <div class="section-heading">
        <h2>Pilih Zikir</h2>
      </div>

      <div class="zikir-options">
        ${daftarZikir.map(z => `
          <button class="zikir-choice ${z.id === selected.id ? "active" : ""}"
            data-zikir="${z.id}">
            <span class="zikir-choice-name">${z.nama}</span>
            <span class="zikir-choice-arab" lang="ar" dir="rtl">${z.arab}</span>
            <span class="zikir-choice-meaning">${z.arti}</span>
          </button>
        `).join("")}
      </div>

      <div class="daily-card" style="text-align:center">

        <div class="card-label">DIGITAL TASBIH</div>

        <h2 id="zikirTitle" class="card-heading">
          ${selected.nama}
        </h2>

        <div id="zikirArabic" class="zikir-main-arab" lang="ar" dir="rtl">
          ${selected.arab}
        </div>

        <p id="zikirMeaning" class="translation">
          ${selected.arti}
        </p>

        <div id="tasbihCount"
          style="font-family:'Cormorant Garamond';font-size:65px;font-weight:600;margin:18px 0;color:#5b3a50">
          0
        </div>

        <p id="tasbihTarget" class="translation">33 kali</p>
        <p id="tasbihInfo" class="translation">0 dari 33 kali</p>

        <div style="height:7px;background:#e3efe0;border-radius:10px;margin:20px 0;overflow:hidden">
          <div id="tasbihProgress" style="height:100%;width:0;background:#7d5a6e;transition:.2s"></div>
        </div>

        <div style="display:flex;gap:8px;justify-content:center;margin-bottom:20px">
          <button class="action" data-target="33">33</button>
          <button class="action" data-target="99">99</button>
          <button class="action" data-target="100">100</button>
        </div>

        <button id="tasbihTap"
          style="width:150px;height:150px;border-radius:50%;border:7px solid #e3efe0;background:linear-gradient(145deg,#5b3a50,#7d5a6e);color:white;font-weight:600;letter-spacing:2px;box-shadow:0 10px 25px #5b3a5030">
          ZIKIR
        </button>

        <div style="margin-top:20px">
          <button id="tasbihReset" class="see-all">
            ↻ Ulangi hitungan
          </button>
        </div>

      </div>
    </section>
  `;

  let count = 0;
  let target = 33;

  const countText = document.getElementById("tasbihCount");
  const targetText = document.getElementById("tasbihTarget");
  const infoText = document.getElementById("tasbihInfo");
  const progress = document.getElementById("tasbihProgress");
  const tapButton = document.getElementById("tasbihTap");

  function loadZikir() {
    try {
      count = Number(localStorage.getItem("zikirCount_" + selected.id)) || 0;
      target = Number(localStorage.getItem("zikirTarget_" + selected.id)) || 33;
    } catch (error) {
      count = 0;
      target = 33;
    }

    if (![33, 99, 100].includes(target)) target = 33;

    updateTasbih();
  }

  function updateTasbih() {
    countText.textContent = count;
    targetText.textContent = target + " kali";
    infoText.textContent = count + " dari " + target + " kali";

    progress.style.width = Math.min((count / target) * 100, 100) + "%";

    document.querySelectorAll("[data-target]").forEach(button => {
      button.classList.toggle(
        "active",
        Number(button.dataset.target) === target
      );
    });

    tapButton.textContent = count >= target ? "SELESAI ✓" : "ZIKIR";

    try {
      localStorage.setItem("zikirCount_" + selected.id, count);
      localStorage.setItem("zikirTarget_" + selected.id, target);
    } catch (error) {}
  }

  document.querySelectorAll(".zikir-choice").forEach(button => {
    button.addEventListener("click", () => {
      const id = button.dataset.zikir;
      selected = daftarZikir.find(z => z.id === id);

      document.getElementById("zikirTitle").textContent = selected.nama;
      document.getElementById("zikirArabic").textContent = selected.arab;
      document.getElementById("zikirMeaning").textContent = selected.arti;

      document.querySelectorAll(".zikir-choice").forEach(item => {
        item.classList.toggle(
          "active",
          item.dataset.zikir === selected.id
        );
      });

      loadZikir();
    });
  });

  document.querySelectorAll("[data-target]").forEach(button => {
    button.addEventListener("click", () => {
      target = Number(button.dataset.target);
      updateTasbih();
    });
  });

  tapButton.addEventListener("click", () => {
    if (count >= target) {
      showNotice("Jumlah bacaan tercapai, Masya Allah!");
      return;
    }

    count++;
    updateTasbih();

    if (count === target) {
      showNotice("Jumlah bacaan tercapai, Masya Allah!");
    }
  });

  document.getElementById("tasbihReset").addEventListener("click", () => {
    count = 0;
    updateTasbih();
    showNotice("Hitungan berhasil diulang");
  });

  loadZikir();
  setupNavigation("Zikir");
}


// Tombol navigasi
setupHomeButtons();
setupNavigation();
</script>

</body>
</html>
