<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eef4ec">
<title>Cahaya Doa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --green:#5b3a50;
  --dark-green: #47293d;
  --olive: #7d5a6e;
  --cream: #eef4ec;
  --gold: #a8c4a0;
  --text: #5b3a50;
  --muted: #9a8296;
  --card: #ffffff;
  --stroke: #d5e3d1;
  --soft: #e3efe0;
  --plum-soft: #efe6ec;
}

body {
  background:
    radial-gradient(1200px 500px at 50% -10%, #e6efe2 0%, transparent 60%),
    radial-gradient(900px 400px at 110% 110%, #e9e0e6 0%, transparent 55%),
    #d8e5d4;
  color: var(--text);
  font-family: "Plus Jakarta Sans", "Segoe UI", Arial, sans-serif;
  min-height: 100vh;
}

.font-serif {
  font-family: "Cormorant Garamond", Georgia, serif;
}

.arabic, [lang="ar"] {
  font-family: "Amiri", "Traditional Arabic", Georgia, serif;
}

button {
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.app {
  width: 100%;
  max-width: 440px;
  height: 100dvh;
  margin: 0 auto;
  background:
    radial-gradient(600px 260px at 100% 0%, #e9e0e655 0%, transparent 70%),
    radial-gradient(500px 240px at 0% 18%, #dfeadcaa 0%, transparent 70%),
    var(--cream);
  position: relative;
  padding-bottom: 95px;
  overflow: hidden;
  box-shadow: 0 0 40px #5b3a500c;
}

.topbar {
  padding: 28px 24px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 44px;
  height: 44px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #5b3a50, #7d5a6e);
  color: #f3eaf0;
  font-size: 22px;
  box-shadow: 0 6px 18px #5b3a5033, inset 0 1px 0 #ffffff30;
}

.brand-name {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -.3px;
  color: #5b3a50;
}

.brand-subtitle {
  color: var(--muted);
  font-size: 8.5px;
  margin-top: 2px;
  letter-spacing: 2.4px;
  font-weight: 500;
}

.profile {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #fff;
  border: 1px solid var(--stroke);
  color: var(--green);
  font-size: 18px;
  box-shadow: 0 3px 12px #5b3a500a;
  transition: .2s;
}

.profile:active {
  transform: scale(.93);
}

.greeting {
  padding: 16px 24px 20px;
  position: relative;
}

.date {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 9.5px;
  letter-spacing: 2.4px;
  color: var(--olive);
  text-transform: uppercase;
  margin-bottom: 12px;
  font-weight: 600;
}

.date::before {
  content: "";
  width: 18px;
  height: 1px;
  background: var(--gold);
}

.greeting h1 {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 30px;
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: -.5px;
  color: #5b3a50;
}

.greeting h1 span {
  color: var(--olive);
  font-style: italic;
}

.greeting p {
  margin-top: 9px;
  color: #9a8296;
  font-size: 12px;
  line-height: 1.7;
  font-weight: 300;
}

/* BANNER MASJID */
.mosque-banner {
  margin: 0 20px 24px;
  padding: 14px 16px 6px;
  background:
    radial-gradient(240px 90px at 80% 0%, #efe6ec88 0%, transparent 70%),
    linear-gradient(165deg, #f7fbf6 0%, #eef4ec 100%);
  border: 1px solid #d5e3d1;
  border-radius: 26px;
  box-shadow: 0 8px 26px #5b3a500e;
  overflow: hidden;
  position: relative;
}

.mosque-banner::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, #7d5a6e, #a8c4a0, #7d5a6e);
  opacity: .7;
}

.mosque-banner svg {
  display: block;
  width: 100%;
  height: auto;
  animation: floaty 5s ease-in-out infinite;
}

@keyframes floaty {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* KARTU DOA HARIAN — hero */
.daily-card {
  position: relative;
  margin: 2px 20px 30px;
  border-radius: 26px;
  padding: 26px 22px 20px;
  color: var(--text);
  background:
    radial-gradient(220px 140px at 110% -10%, #5b3a5014 0%, transparent 70%),
    radial-gradient(200px 140px at -10% 110%, #a8c4a030 0%, transparent 70%),
    linear-gradient(165deg, #ffffff 0%, #f6faf4 100%);
  border: 1px solid #d5e3d1;
  box-shadow: 0 10px 32px #5b3a5012, 0 1px 0 #ffffffaa inset;
  overflow: hidden;
}

.daily-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, #7d5a6e, #a8c4a0, #7d5a6e);
  opacity: .7;
}

.daily-card::after {
  content: "﷽";
  position: absolute;
  right: -12px;
  bottom: -18px;
  font-size: 90px;
  font-family: "Amiri", serif;
  color: #5b3a500a;
  pointer-events: none;
  line-height: 1;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  z-index: 1;
}

.card-label {
  font-size: 8.5px;
  letter-spacing: 2.2px;
  color: #7d5a6e;
  text-transform: uppercase;
  font-weight: 600;
}

.card-date {
  font-size: 9px;
  letter-spacing: .5px;
  color: #7d5a6e;
  background: #e3efe0;
  padding: 6px 12px;
  border-radius: 20px;
  font-weight: 500;
}

.card-heading {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 25px;
  font-weight: 600;
  margin-top: 18px;
  position: relative;
  z-index: 1;
  line-height: 1.3;
  color: #5b3a50;
}

.daily-card .arabic {
  font-family: "Amiri", serif;
  font-size: 32px;
  text-align: center;
  line-height: 2.2;
  margin: 20px 0 14px;
  position: relative;
  z-index: 1;
  color: #47293d;
}

.translation {
  text-align: center;
  color: #8a7290;
  font-size: 12px;
  line-height: 1.85;
  position: relative;
  z-index: 1;
  padding: 0 4px;
  font-weight: 300;
}

.card-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, #d5e3d1, transparent);
  margin: 22px 0 14px;
  position: relative;
  z-index: 1;
}

.card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 1;
}

.source {
  font-size: 10px;
  letter-spacing: 1px;
  color: #9a8296;
}

.card-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.action {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid #d5e3d1;
  background: #fff;
  color: var(--green);
  display: grid;
  place-items: center;
  font-size: 15px;
  transition: .18s;
  box-shadow: 0 2px 8px #5b3a500a;
}

.action:active {
  transform: scale(.88);
}

.action.favorite.active {
  background: linear-gradient(145deg, #5b3a50, #7d5a6e);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 14px #5b3a5040;
}

.section {
  padding: 0 22px;
  margin-bottom: 28px;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.section-heading h2 {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 22px;
  font-weight: 600;
  color: #5b3a50;
}

.see-all {
  border: 0;
  background: transparent;
  color: #7d5a6e;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .3px;
  padding: 6px 2px;
}

.see-all:active {
  opacity: .6;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px;
}

.category-card {
  border: 1px solid #d5e3d1;
  background: linear-gradient(160deg, #ffffff 0%, #f7fbf6 100%);
  border-radius: 20px;
  padding: 16px 13px;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  min-height: 80px;
  transition: .2s;
  box-shadow: 0 4px 16px #5b3a5008;
  position: relative;
  overflow: hidden;
}

.category-card::after {
  content: "";
  position: absolute;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: #a8c4a022;
  top: -28px;
  right: -22px;
  pointer-events: none;
}

.category-card:active {
  transform: scale(.96);
  box-shadow: 0 2px 8px #5b3a500a;
}

.category-icon {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border-radius: 16px;
  background: linear-gradient(145deg, #e3efe0, #d9e8d5);
  display: grid;
  place-items: center;
  font-size: 19px;
  color: #5b3a50;
  box-shadow: inset 0 1px 0 #ffffff80;
}

.category-card:nth-child(2) .category-icon {
  background: linear-gradient(145deg, #efe6ec, #e5d9e1);
}

.category-card:nth-child(3) .category-icon {
  background: linear-gradient(145deg, #e9f0e4, #dcead6);
}

.category-card:nth-child(4) .category-icon {
  background: linear-gradient(145deg, #f0ebe4, #e8dfd5);
}

.category-name {
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.5;
  color: #5b3a50;
}

.category-count {
  font-size: 10px;
  color: #9a8296;
  margin-top: 3px;
  font-weight: 300;
}

/* NAVIGASI BAWAH — floating */
.bottom-nav {
  position: absolute;
  z-index: 10;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 408px;
  height: 64px;
  padding: 6px;
  background: #ffffffee;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid #d5e3d1;
  border-radius: 24px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  box-shadow: 0 10px 30px #5b3a501a, 0 1px 0 #ffffffcc inset;
}

.nav-item {
  border: 0;
  background: transparent;
  color: #b3a3ba;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 9.5px;
  font-weight: 500;
  border-radius: 18px;
  transition: .18s;
}

.nav-icon {
  font-size: 19px;
  line-height: 1;
}

.nav-item.active {
  color: #5b3a50;
  font-weight: 600;
  background: linear-gradient(145deg, #e3efe0, #efe6ec);
}

.nav-item.active .nav-icon {
  transform: translateY(-1px);
}

.notice {
  position: fixed;
  left: 50%;
  bottom: 90px;
  transform: translate(-50%, 10px);
  background: #5b3a50;
  color: white;
  padding: 12px 18px;
  border-radius: 12px;
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transition: .2s;
  z-index: 20;
  width: max-content;
  max-width: 90%;
}

.notice.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* Animasi */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

.topbar,
.greeting,
.mosque-banner,
.daily-card,
.section,
.prayer,
.tasbih-card {
  animation: fadeUp .55s cubic-bezier(.22, 1, .36, 1) both;
}

.greeting { animation-delay: .05s; }
.mosque-banner { animation-delay: .1s; }
.daily-card { animation-delay: .17s; }
.section { animation-delay: .24s; }


@media (min-width: 600px) {
  body {
    min-height: 100vh;
    padding: 16px 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .app {
    width: 420px;
    max-width: calc(100vw - 40px);
    height: calc(100vh - 32px);
    min-height: 0;
    margin: 0 auto;
    border: 8px solid #252823;
    border-radius: 42px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }

  .bottom-nav {
    position: sticky;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    margin: 0 auto;
  }
}

/* KARTU DOA */
.arabic {
  font-size: 29px;
  text-align: center;
  line-height: 2;
  margin: 15px 0 10px;
}

.prayer {
  background: linear-gradient(165deg, #ffffff 0%, #f8fbf7 100%);
  border: 1px solid #d5e3d1;
  border-radius: 22px;
  padding: 22px 18px 18px;
  margin-bottom: 14px;
  box-shadow: 0 4px 18px #5b3a5008;
  transition: .2s;
  position: relative;
  overflow: hidden;
}

.prayer::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, #a8c4a0, #7d5a6e);
  opacity: .55;
}

.prayer:active {
  transform: scale(.985);
  box-shadow: 0 2px 10px #5b3a500a;
}

.prayer-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.number {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: linear-gradient(145deg, #e3efe0, #efe6ec);
  color: #5b3a50;
  font-weight: 600;
  font-size: 14px;
  font-family: "Cormorant Garamond", Georgia, serif;
}

.prayer h3 {
  color: #5b3a50;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 5px;
}

.tag {
  display: inline-block;
  background: #e3efe0;
  color: #7d5a6e;
  padding: 5px 11px;
  border-radius: 20px;
  font-size: 9.5px;
  letter-spacing: .4px;
  font-weight: 500;
}

.prayer .arabic {
  font-family: "Amiri", serif;
  color: #47293d;
  font-size: 30px;
  line-height: 2.2;
  margin: 18px 0 10px;
  text-align: center;
}

.latin {
  color: #8a7290;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 15px;
  font-style: italic;
  line-height: 1.7;
  margin-bottom: 14px;
}

.meaning {
  background: linear-gradient(145deg, #f3f8f2, #efe6ec66);
  border-radius: 16px;
  padding: 14px;
  color: #7d5a6e;
  font-size: 12px;
  line-height: 1.75;
  border: 1px solid #d5e3d180;
}

.meaning strong {
  display: block;
  color: #5b3a50;
  font-size: 9px;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.speak-btn {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid #d5e3d1;
  background: #fff;
  color: #7d5a6e;
  font-size: 15px;
  display: grid;
  place-items: center;
  transition: .18s;
  box-shadow: 0 2px 8px #5b3a500a;
}

.speak-btn:active {
  transform: scale(.88);
}

.speak-btn.speaking {
  background: linear-gradient(145deg, #5b3a50, #7d5a6e);
  border-color: transparent;
  color: #fff;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 #5b3a5044; }
  50% { box-shadow: 0 0 0 7px #5b3a5000; }
}


/* DESAIN HP CAHAYA DOA */
@media (min-width: 601px) {
  body {
    min-height: 100vh;
    padding: 24px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #d8e5d4;
  }

  .app {
    width: 320px;
    height: calc(100vh - 32px);
    min-height: 0;
    padding-bottom: 85px;
    margin: 0 auto;
    border: 8px solid #252823;
    border-radius: 42px;
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 0 0 2px #c9dccb, 0 20px 45px #5b3a5025;
    scrollbar-width: none;
  }

  .app::-webkit-scrollbar {
    display: none;
  }

  .app::before {
    content: "";
    position: absolute;
    z-index: 30;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 85px;
    height: 19px;
    border-radius: 20px;
    background: #171916;
    pointer-events: none;
  }

  .topbar {
    padding-top: 34px;
  }

  .daily-card {
    min-height: 0;
    padding: 15px;
  }

  .daily-card .arabic {
    font-size: 25px;
    margin: 10px 0;
  }

  .card-heading {
    margin-top: 16px;
    font-size: 19px;
  }

  .translation {
    font-size: 11px;
  }

  .bottom-nav {
    position: sticky;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    height: 64px;
    margin: 0 auto 8px;
  }
}

/* TAMPILAN HP ASLI */
@media (max-width: 600px) {
  body {
    padding: 0;
    background: var(--cream);
  }

  .app {
    width: 320px;
    max-width: none;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    margin: 0;
    padding-bottom: 95px;
    border: none;
    border-radius: 0;
    box-shadow: none;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .app::before {
    display: none;
  }

  .bottom-nav {
    position: sticky;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 408px;
    margin: 0 auto;
  }
}


/* SELURUH BERANDA MUAT DALAM SATU LAYAR */
@media (min-width: 601px) {
  .app {
    height: min(780px, calc(100vh - 48px));
    overflow: hidden;
    display: block;
    position: relative;
    padding-bottom: 0px;
  }

  .page-content {
    height: 100%;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 90px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }

  .page-content::-webkit-scrollbar {
    display: none;
  }

  .app > .bottom-nav {
    position: absolute;
    z-index: 50;
    bottom: 12px;
    left: 50%;
    right: auto;
    width: calc(100% - 32px);
    max-width: 408px;
    height: 64px;
    margin: 0;
    transform: translateX(-50%);
    flex-shrink: 0;
  }

  .topbar {
    flex-shrink: 0;
    padding: 24px 18px 10px;
  }

  .greeting {
    flex-shrink: 0;
    padding: 5px 20px 12px;
  }

  .greeting h1 {
    font-size: 23px;
  }

  .greeting p {
    font-size: 11px;
    margin-top: 4px;
  }

  .mosque-banner {
    flex-shrink: 0;
    margin: 0 15px 12px;
    padding: 8px 14px 2px;
  }

  .daily-card {
    flex: 1;
    min-height: 0;
    margin: 0 15px 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
  }

  .card-heading {
    margin-top: 12px;
    font-size: 18px;
  }

  .daily-card .arabic {
    font-size: 25px;
    margin: 8px 0;
  }

  .translation {
    font-size: 11px;
  }

  .card-divider {
    margin: 10px 0;
  }

  .section {
    flex-shrink: 0;
    margin-bottom: 12px;
    padding: 0 15px;
  }

  .section-heading {
    margin-bottom: 9px;
  }

  .section-heading h2 {
    font-size: 18px;
  }

  .category-card {
    min-height: 62px;

<script>
const notice = document.getElementById("notice");
let noticeTimeout;

function showNotice(message) {
  notice.textContent = message;
  notice.classList.add("show");
  clearTimeout(noticeTimeout);
  noticeTimeout = setTimeout(() => {
    notice.classList.remove("show");
  }, 2200);
}

// Sapaan
document.getElementById("today").textContent = "ASSALAMUALAIKUM";

// Pre-load daftar voice (browser load async)
if ("speechSynthesis" in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

// Favorit (opsional — ada kalau kartu harian tampil)
const favoriteButton = document.getElementById("favoriteButton");

function renderFavorite(active) {
  if (!favoriteButton) return;
  favoriteButton.classList.toggle("active", active);
  favoriteButton.textContent = active ? "♥" : "♡";
}

let isFavorite = false;
try {
  isFavorite = localStorage.getItem("cahayaFavorit") === "1";
} catch (error) {}
renderFavorite(isFavorite);

if (favoriteButton) {
  favoriteButton.addEventListener("click", () => {
    isFavorite = !isFavorite;
    renderFavorite(isFavorite);
    try {
      localStorage.setItem("cahayaFavorit", isFavorite ? "1" : "0");
    } catch (error) {}
    showNotice(isFavorite ? "Doa ditambahkan ke favorit" : "Doa dihapus dari favorit");
  });
}

// Bacakan doa (opsional — ada kalau kartu harian tampil)
const playButton = document.getElementById("playButton");

function resetPlayButton() {
  if (!playButton) return;
  playButton.textContent = "▶";
  playButton.setAttribute("aria-label", "Bacakan doa");
}

if (playButton) {
  playButton.addEventListener("click", () => {
    if (!("speechSynthesis" in window)) {
      showNotice("Fitur suara belum tersedia di browser ini");
      return;
    }
    if (window.speechSynthesis.speaking) {
      stopSpeech();
      showNotice("Bacaan dihentikan");
      return;
    }

    const arabicText = (document.querySelector(".daily-card .arabic")?.textContent || "").trim();
    const translation = document.querySelector(".daily-card .translation");
    const meaningText = (translation?.innerText || translation?.textContent || "").trim();

    speechToken++;
    const token = speechToken;

    const playMeaning = () => {
      if (token !== speechToken) return;
      const utterance = new SpeechSynthesisUtterance(meaningText);
      utterance.lang = "id-ID";
      utterance.rate = 0.85;
      utterance.onend = resetPlayButton;
      utterance.onerror = resetPlayButton;
      window.speechSynthesis.speak(utterance);
    };

    const arabic = new SpeechSynthesisUtterance(arabicText);
    arabic.lang = "ar-SA";
    arabic.rate = 0.8;
    arabic.onend = playMeaning;
    arabic.onerror = playMeaning;
    window.speechSynthesis.speak(arabic);

    playButton.textContent = "⏸";
    playButton.setAttribute("aria-label", "Hentikan bacaan");
    showNotice("Membacakan doa Arab, lalu artinya");
  });
}

// Suara umum: bacakan teks (arti doa) dengan TTS
let activeSpeakBtn = null;
let speechToken = 0;

function resetSpeakBtn() {
  if (activeSpeakBtn) {
    activeSpeakBtn.classList.remove("speaking");
    activeSpeakBtn.textContent = "🔊";
    activeSpeakBtn = null;
  }
}

function stopSpeech() {
  speechToken++;
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  resetSpeakBtn();
  resetPlayButton();
}

function speakText(text, btn) {
  if (!("speechSynthesis" in window)) {
    showNotice("Fitur suara belum tersedia di browser ini");
    return;
  }

  if (window.speechSynthesis.speaking) {
    const sameBtn = activeSpeakBtn === btn;
    stopSpeech();
    if (sameBtn) {
      showNotice("Bacaan dihentikan");
      return;
    }
  }

  speechToken++;
  const token = speechToken;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "id-ID";
  utterance.rate = 0.85;
  utterance.onend = () => { if (token === speechToken) resetSpeakBtn(); };
  utterance.onerror = () => { if (token === speechToken) resetSpeakBtn(); };
  window.speechSynthesis.speak(utterance);
  resetPlayButton();

  if (btn) {
    resetSpeakBtn();
    activeSpeakBtn = btn;
    btn.classList.add("speaking");
    btn.textContent = "⏹";
  }
  showNotice("Membacakan arti doa");
}

// Cari voice Arab terbaik di device
function pickArabicVoice() {
  if (!("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => /^ar[-_]?(SA|EG|SY|AE)?/i.test(v.lang)) ||
         voices.find(v => v.lang.toLowerCase().startsWith("ar")) ||
         null;
}

// Suara doa: Arab dulu, lalu artinya
function speakPrayer(prayer, btn) {
  if (!("speechSynthesis" in window)) {
    showNotice("Fitur suara belum tersedia di browser ini");
    return;
  }

  if (window.speechSynthesis.speaking) {
    const sameBtn = activeSpeakBtn === btn;
    stopSpeech();
    if (sameBtn) {
      showNotice("Bacaan dihentikan");
      return;
    }
  }

  speechToken++;
  const token = speechToken;

  const playMeaning = () => {
    if (token !== speechToken) return;
    const meaning = new SpeechSynthesisUtterance(prayer.meaning);
    meaning.lang = "id-ID";
    meaning.rate = 0.85;
    meaning.onend = () => { if (token === speechToken) resetSpeakBtn(); };
    meaning.onerror = () => { if (token === speechToken) resetSpeakBtn(); };
    window.speechSynthesis.speak(meaning);
  };

  const arVoice = pickArabicVoice();
  const arabic = new SpeechSynthesisUtterance(arVoice ? prayer.arabic : prayer.latin);
  if (arVoice) {
    arabic.voice = arVoice;
    arabic.lang = arVoice.lang;
  } else {
    // Device tanpa voice Arab: latin dibaca pelan sebagai pengganti
    arabic.lang = "id-ID";
  }
  arabic.rate = 0.78;
  arabic.onend = playMeaning;
  arabic.onerror = playMeaning;
  window.speechSynthesis.speak(arabic);
  resetPlayButton();

  if (btn) {
    resetSpeakBtn();
    activeSpeakBtn = btn;
    btn.classList.add("speaking");
    btn.textContent = "⏹";
  }
  showNotice(arVoice
    ? "Membacakan doa Arab, lalu artinya"
    : "Membacakan latin doa, lalu artinya");
}

// Bagikan doa (opsional — ada kalau kartu harian tampil)
document.getElementById("shareButton")?.addEventListener("click", async () => {
  const text = "Doa Memohon Ilmu\nRabbi zidnii 'ilmaa.\nYa Tuhanku, tambahkanlah ilmu kepadaku. (QS. Taha: 114)";
  try {
    if (navigator.share) {
      await navigator.share({ title: "Cahaya Doa", text });
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(text);
      showNotice("Doa berhasil disalin");
    } else {
      showNotice("Fitur berbagi belum tersedia");
    }
  } catch (error) {
    if (error.name !== "AbortError") showNotice("Belum dapat membagikan doa");
  }
});

function setupNavigation() {
  document.querySelectorAll(".nav-item").forEach(button => {
    button.addEventListener("click", () => {
      stopSpeech();
      resetPlayButton();
      resetSpeakBtn();

      const page = button.dataset.page;
      if (page === "Home") {
        location.reload();
      } else if (page === "Explore") {
        openExplore();
      } else if (page === "Zikir") {
        openZikir();
      } else if (page === "Profil") {
        openProfil();
      }
    });
  });
}

// Menampilkan daftar doa
function renderExplore() {
  const search = document.getElementById("exploreSearch");
  if (!search) return;

  const keyword = search.value.toLowerCase();
  const filtered = explorePrayers.filter(prayer =>
    (prayer.title + " " + prayer.category).toLowerCase().includes(keyword)
  );

  document.getElementById("exploreList").innerHTML = filtered.map((prayer, index) => `
    <article class="prayer">
      <button class="speak-btn" data-speak="${explorePrayers.indexOf(prayer)}" aria-label="Bacakan doa">🔊</button>
      <div class="prayer-top">
        <div class="number">${index + 1}</div>
        <div>
          <h3>${prayer.title}</h3>
          <div class="tag">${prayer.category}</div>
        </div>
      </div>
      <div class="arabic" lang="ar" dir="rtl">${prayer.arabic}</div>
      <div class="latin">${prayer.latin}</div>
      <div class="meaning"><strong>Artinya</strong>${prayer.meaning}</div>
    </article>
  `).join("");

  document.getElementById("noResults").style.display =
    filtered.length ? "none" : "block";

  document.querySelectorAll("[data-speak]").forEach(btn => {
    btn.addEventListener("click", event => {
      event.stopPropagation();
      const prayer = explorePrayers[Number(btn.dataset.speak)];
      speakPrayer(prayer, btn);
    });
  });
}

      );
    });

    tapButton.textContent = count >= target ? "SELESAI ✓" : "ZIKIR";

    try {
      localStorage.setItem("tasbihCount", count);
      localStorage.setItem("tasbihTarget", target);
    } catch (error) {}
  }

  document.querySelectorAll("[data-target]").forEach(button => {
    button.addEventListener("click", () => {
      target = Number(button.dataset.target);
      updateTasbih();
    });
  });

  tapButton.addEventListener("click", () => {
    if (count >= target) {
      showNotice("Target tercapai, Masya Allah!");
      return;
    }

    count++;
    updateTasbih();

    if (count === target) {
      showNotice("Target zikir tercapai, Masya Allah!");
    }
  });

  document.getElementById("tasbihReset").addEventListener("click", () => {
    count = 0;
    updateTasbih();
    showNotice("Hitungan berhasil diulang");
  });

  updateTasbih();
  setupNavigation();
}

// Tombol Profil di bagian atas Home
document.getElementById("profileButton").addEventListener("click", openProfil);

// Tombol Lihat Semua
document.getElementById("exploreButton").addEventListener("click", openExplore);

document.querySelectorAll(".category-card").forEach(button => {
  button.addEventListener("click", () => {
    openExplore();

    const search = document.getElementById("exploreSearch");
    search.value = button.dataset.filter || "";
    renderExplore();
  });
});

// Navigasi bawah
setupNavigation();

</script>
